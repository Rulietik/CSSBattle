<!DOCTYPE html>

<html lang="en">
   <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
		 <style>
			body {
				background: #51A499;
			}
			div{
				background: #FEE190;
				position: absolute;
				width: 40px;
				height: 200px;
			}
			.vertical{
				left: 80px;
				top: 50px;
				box-shadow: 200px 0px #FEE190;
			}
			.horizontal{
				rotate: 90deg;
				left: 200px;
				top: -10px;
				box-shadow: 120px 0px #FEE190;
			}
			.bottom{
				width: 60px;
				height: 10px;
				top: 250px;
				left: 60px;
				box-shadow: 220px 0px #FEE190;
			}
		</style>
	 </head> 
   <body>
		 <div class = "vertical"></div>
		 <div class = "horizontal"></div>
		 <div class = "bottom"></div>
   </body>
</html>
