<!DOCTYPE html>

<html lang="en">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                background: #F2EAA8;
                margin: 0;
            }
            .line {
                width: 80px;
                height: 30px;
                background: #4760B6;
                position: absolute;
                left: 85px;
                top: 75px;
                border-radius: 1em;
                box-shadow:
                0px 60px #4760B6,
                0px 120px #4760B6,
                150px 60px #4760B6,
                150px 120px #4760B6,
                150px 0px #4760B6;
            }
            .quad{
                width: 30px;
                height: 30px;
                background: #4760B6;
                position: absolute;
                left: 185px;
                top: 135px;
                border-radius: 0.5em;
            }
            .rotated{
                rotate: 45deg;
            }
            #up{
                top: 75px;
            }
            #down{
                top: 195px;
            }
        </style>
    </head> 
    <body>
		<div class = "line"></div>
        <div class = "quad rotated" id="up"></div>
        <div class = "quad"></div>
        <div class = "quad rotated" id="down"></div>
	</body>
</html>
