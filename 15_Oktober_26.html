<!DOCTYPE html>

<html lang="en">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
            .container {
                width: 190px;
                height: 170px;
                background: #D9D9D9;
                position: absolute;
                left: 105px;
                top: 90px;
                display: grid;
                grid-template-columns: auto auto auto auto;
                justify-items: center;
                align-items: center;
                box-sizing: border-box;
                padding: 15px;
                padding-top: 45px;
                padding-bottom: 25px;
            }
            .day{
                background: #8C8C8C;
                width: 20px;
                height: 20px;
            }
            #imposter{
                background: #CA5348;
            }
            .hanger{
                background: #8C8C8C;
                width: 20px;
                height: 40px;
                position: absolute;
                left: 135px;
                top: 70px;
                box-shadow: 110px 0px #8C8C8C;
            }
        </style>
	 </head> 
   <body>
		<div class = "container">
        <div class= "day"></div>
        <div class= "day"></div>
        <div class= "day"></div>
        <div class= "day" id="imposter"></div>
        <div class= "day"></div>
        <div class= "day"></div>
        <div class= "day"></div>
        <div class= "day"></div>
        </div>
        <div class = "hanger"></div>
   </body>
</html>
