<!DOCTYPE html>

<html lang="en">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
            body {
				background: #81BE48;
				display: grid;
				place-items: center;
				margin: 0;
				height: 100vh;
			}
			.whitequad {
				width: 80px;
				height: 80px;
				border-style: solid;
				border-radius: 30px;
				border-color: white;
				border-width: 50px;
				grid-area: 1/1;
			}
			.line {
				width: 50px;
				height: 250px;
				rotate: -45deg;
				background: #81BE48;
				grid-area: 1/1;
			}
        </style>
	 </head> 
   <body>
		<div class = "whiteQuad"></div>
		<div class = "line"></div>
   </body>
</html>
